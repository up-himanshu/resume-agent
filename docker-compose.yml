services:
  postgres:
    # Official Postgres image with the pgvector extension pre-installed.
    image: pgvector/pgvector:pg17
    container_name: resume-agent-postgres
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume
      POSTGRES_DB: resume_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, on first start of an empty volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
